name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the tools
        run: python -m unittest discover -s tools

      - name: Check every entry and repo.json
        run: python tools/holocron.py validate --check-index

      - name: Check changed entries and their downloads
        if: github.event_name == 'pull_request'
        run: python tools/holocron.py validate --base origin/${{ github.base_ref }}
